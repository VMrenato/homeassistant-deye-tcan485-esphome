# Deye SUN-6K-SG05LP1 — Write controls (opt-in package)
# ========================================================
#
# ⚠️ USE AT YOUR OWN RISK ⚠️
#
# This package exposes exactly TWO write controls, both on Time-of-Use
# program slot 5 (registers 272 and 278). They were verified on a real
# SUN-6K-SG05LP1-EU-AM2-P: every write was confirmed by reading the register
# back over Modbus AND on the inverter's LCD (System Work Mode → Time of Use).
# That is still one unit with one firmware — check yours before relying on it.
#
# THE AUTHORS AND MAINTAINERS OF THIS PROJECT ASSUME NO RESPONSIBILITY FOR
# ANY DAMAGE, DATA LOSS, EQUIPMENT FAILURE, OR FINANCIAL COST INCURRED AS A
# RESULT OF USING THIS FILE.
#
# Design rules (learned the hard way):
#   1. Read before write. The main config's `deye_cfg` controller mirrors
#      registers 248-279 read-only. Look at those values in Home Assistant
#      (and on the LCD) BEFORE adding this package.
#   2. Function 0x10 only. Deye requires "Write Multiple Registers" (0x10)
#      for settings; every number here sets `use_write_multiple: true`.
#   3. Range-limited numbers, never free-form writes. Each writable register
#      gets a `number` with min/max clamps, so a bad value is rejected by
#      ESPHome before it reaches the bus.
#   4. No `write_lambda` that builds a payload. On a modbus_controller
#      switch, a write_lambda that pushes bytes into `payload` is sent as a
#      RAW custom frame (the log shows "broadcast refused function 0x4") —
#      not as a register write. Use a range-limited number + template switch
#      (as below) instead.
#   5. Touch one bit, refuse everything else. The grid-charge switch only
#      flips register 278 between 4 and 5 and refuses to act if the current
#      value is anything else, so other mode bits are never overwritten.
#
# Requires the main esphome/deye-inversor.yaml (it defines the `deye_cfg`
# controller and the `prog5_flags_r` read-back sensor used here).
#
# How to use — in your ESPHome device file:
#
#   packages:
#     deye_read: !include esphome/deye-inversor.yaml
#     deye_write: !include esphome/deye-inversor-write.yaml
#
# Other slots: copy the blocks and change the addresses — slot N uses
# SOC register 267+N and flags register 273+N (N = 1..6). Slot start times
# are registers 250-255 (HHMM, e.g. 1700 = 17:00).
#
# Not implemented on purpose:
#   - Register 43 (on/off) and 20 (remote lock): on the tested unit they read
#     0 and 255 while the inverter is running, which does not match the
#     documented values (1 = on; 0 = unlocked / 2 = locked). Until their
#     meaning is confirmed there is NO on/off control here.
#   - Max charge / discharge current, export limit, grid charge enable,
#     work mode: see docs/registers.md for the V1.19 addresses (210, 211,
#     245, 232, 243). Not exercised on hardware, so not shipped.

number:
  # Register 272 — Time-of-Use slot 5 target SOC (%).
  # Clamped to 20-90 % so a typo can neither drain nor force-fill the battery.
  - platform: modbus_controller
    modbus_controller_id: deye_cfg
    id: prog5_soc_w
    name: "Deye TOU Slot 5 SOC"
    address: 272
    register_type: holding
    value_type: U_WORD
    min_value: 20
    max_value: 90
    step: 1
    unit_of_measurement: "%"
    use_write_multiple: true
    mode: box
    entity_category: config

  # Register 278 — Time-of-Use slot 5 charge flags. Internal only: it can
  # hold 4 (bit2 set, grid charge off) or 5 (bit0 grid charge + bit2).
  # Driven exclusively by the template switch below.
  - platform: modbus_controller
    modbus_controller_id: deye_cfg
    id: prog5_flags_w
    internal: true
    address: 278
    register_type: holding
    value_type: U_WORD
    min_value: 4
    max_value: 5
    step: 1
    use_write_multiple: true

switch:
  # Grid charge for TOU slot 5 = bit0 of register 278.
  # State comes from the read-only mirror (prog5_flags_r, updated every
  # 120 s), so after a toggle the switch shows the inverter's real value
  # on the next settings poll.
  - platform: template
    id: prog5_grid_w
    name: "Deye TOU Slot 5 Grid Charge"
    entity_category: config
    lambda: |-
      if (isnan(id(prog5_flags_r).state)) return {};
      return ((int) id(prog5_flags_r).state & 0x01) == 1;
    turn_on_action:
      - lambda: |-
          int cur = (int) id(prog5_flags_r).state;
          if (cur == 4 || cur == 5) { auto c = id(prog5_flags_w).make_call(); c.set_value(5); c.perform(); }
          else ESP_LOGW("deye_write", "refused: slot 5 flags=%d (expected 4 or 5)", cur);
    turn_off_action:
      - lambda: |-
          int cur = (int) id(prog5_flags_r).state;
          if (cur == 4 || cur == 5) { auto c = id(prog5_flags_w).make_call(); c.set_value(4); c.perform(); }
          else ESP_LOGW("deye_write", "refused: slot 5 flags=%d (expected 4 or 5)", cur);
