    address: 91
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - offset: -100

  # ---------- Battery health ----------
  - platform: modbus_controller
    modbus_controller_id: deye
    name: "Deye Battery Status"
    address: 185
    register_type: holding
    value_type: U_WORD
    icon: mdi:battery-charging

  - platform: modbus_controller
    modbus_controller_id: deye_slow
    name: "Deye Battery Cycle Count"
    address: 611
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "cycles"
    state_class: total_increasing

# Board WS2812 LED (GPIO4): green = RX, blue = TX
light:
  - platform: esp32_rmt_led_strip
    pin: GPIO4
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB
    name: "LED Status"
    id: status_led
    internal: true

globals:
  - id: led_off_ts
    type: uint32_t
    restore_value: no
    initial_value: '0'

interval:
  - interval: 150ms
    then:
      - lambda: |-
          if (id(led_off_ts) != 0 && (millis() - id(led_off_ts)) > 120) {
            id(status_led).turn_off().perform();
            id(led_off_ts) = 0;
          }

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: deye
    name: "Deye Grid Relay State"
    address: 194
    register_type: holding
    device_class: plug

# Raw device-info block (registers 0-19) as hex, for firmware / model identification.
text_sensor:
  - platform: modbus_controller
    modbus_controller_id: deye_cfg
    name: "Deye Cfg Info raw 0-19"
    address: 0
    register_type: holding
    register_count: 20
    response_size: 40
    raw_encode: HEXBYTES
    entity_category: diagnostic
