# Deye SUN-6K-SG05LP1 via Modbus RTU — LilyGO T-CAN485
#
# Final validated config:
#   UART: TX GPIO22 / RX GPIO21 (MAX13487E AutoDirection transceiver — no flow control)
#   Enables (active HIGH): GPIO19 = RS485 EN, GPIO17 = RS485 SE, GPIO16 = 5V Booster
#   A/B -> inverter RS485/MODBUS port (pin2=orange=A, pin1=white-orange=B)
#
# NOTE (ESPHome 2026.9.0+): per-sensor `skip_updates` was retired (breaking
# change, see https://esphome.io/blog/2026/09/16/esphome-2026-9/#breaking-changes).
# "Slow" sensors (voltages, temperatures, currents, daily/total energy) were
# migrated to a second modbus_controller (`deye_slow`, same address, 30s
# interval) instead. Fast sensors (instantaneous power, SOC, grid-connected)
# stay on the original 5s controller.
#
# Publish filters: instantaneous power sensors are polled every 5 s but only
# published on a change >= 25 W or at least once a minute (throttle/delta),
# which cuts Home Assistant database writes without losing responsiveness.
# Templates that add filtered sensors use `.raw_state`, not `.state`.
#
# Settings mirror: a third controller (`deye_cfg`, 120 s) reads the inverter's
# configuration registers (device info, battery SOC thresholds, grid charge,
# Time-of-Use program 1-6) READ-ONLY, so you can see the current settings in
# Home Assistant before ever writing anything. Write controls live in the
# separate, opt-in esphome/deye-inversor-write.yaml.

esphome:
  name: deye-inversor
  friendly_name: Deye Inversor

esp32:
  board: esp32dev

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: mod_bus
  tx_pin: GPIO22
  rx_pin: GPIO21
  baud_rate: 9600
  stop_bits: 1
  debug:
    direction: BOTH
    after:
      timeout: 20ms
    sequence:
      - lambda: |-
          if (direction == uart::UART_DIRECTION_RX) {
            id(status_led).turn_on().set_rgb(0.0, 0.25, 0.0).perform();
          } else {
            id(status_led).turn_on().set_rgb(0.0, 0.0, 0.25).perform();
          }
          id(led_off_ts) = millis();

modbus:
  id: modbus1

modbus_controller:
  - id: deye
    modbus_id: modbus1
    address: 0x01
    setup_priority: -10
    update_interval: 5s
    command_throttle: 50ms
    offline_skip_updates: 3

  - id: deye_slow
    modbus_id: modbus1
    address: 0x01
    setup_priority: -10
    update_interval: 30s
    command_throttle: 50ms
    offline_skip_updates: 3

  # Settings mirror (READ-ONLY): configuration registers change rarely.
  - id: deye_cfg
    modbus_id: modbus1
    address: 0x01
    setup_priority: -10
    update_interval: 120s
    command_throttle: 50ms
    offline_skip_updates: 3

switch:
  - platform: gpio
    pin: GPIO19
    name: "RS485 EN"
    restore_mode: ALWAYS_ON
  - platform: gpio
    pin: GPIO17
    name: "RS485 SE"
    restore_mode: ALWAYS_ON
  - platform: gpio
    pin: GPIO16
    name: "Booster 5V EN"
    restore_mode: ALWAYS_ON

